name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
      - name: Migrations apply to a fresh database
        run: DATABASE_URL=sqlite:///./ci-migrate.db alembic upgrade head
      - name: Dependency vulnerability scan
        run: pip-audit -r requirements.txt --progress-spinner off
        continue-on-error: true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: npm audit (production deps)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t skyntri-api:ci backend
      - name: Smoke test container
        run: |
          docker run -d --name api -p 8000:8000 \
            -e SECRET_KEY="$(python3 -c 'import secrets;print(secrets.token_urlsafe(48))')" \
            -e DATABASE_URL=sqlite:////data/uploads/ci.db \
            -e CORS_ORIGINS=https://example.com \
            skyntri-api:ci
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8000/health && break; sleep 3; done
          curl -sS http://127.0.0.1:8000/health/ready
          docker logs api | tail -50
