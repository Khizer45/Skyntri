name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: skyntri
          POSTGRES_USER: skyntri
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skyntri -d skyntri"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
      - name: Migrations apply to a fresh database (SQLite)
        run: DATABASE_URL=sqlite:///./ci-migrate.db alembic upgrade head
      - name: Migrations apply to PostgreSQL
        run: DATABASE_URL=postgresql+psycopg://skyntri:ci-password@localhost:5432/skyntri alembic upgrade head
      - name: API tests on PostgreSQL
        run: >-
          TEST_DATABASE_URL=postgresql+psycopg://skyntri:ci-password@localhost:5432/skyntri
          pytest -q tests/test_security_hardening.py tests/test_shop.py tests/test_admin_panel.py
          tests/test_input_gate.py tests/test_model_plugins.py
      - name: Dependency vulnerability scan
        run: pip-audit -r requirements.txt --progress-spinner off
        continue-on-error: true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: npm audit (production deps)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t skyntri-api:ci backend
      - name: Smoke test container
        run: |
          docker run -d --name api -p 8000:8000 \
            -e SECRET_KEY="$(python3 -c 'import secrets;print(secrets.token_urlsafe(48))')" \
            -e DATABASE_URL=sqlite:////data/uploads/ci.db \
            -e CORS_ORIGINS=https://example.com \
            skyntri-api:ci
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8000/health && break; sleep 3; done
          curl -sS http://127.0.0.1:8000/health/ready
          docker logs api | tail -50

  compose:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - name: Start full stack with docker compose
        run: docker compose up -d --build
      - name: Smoke test backend and frontend
        run: |
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8000/health && break; sleep 3; done
          curl -fsS http://127.0.0.1:8000/health/ready || true
          curl -fsS -o /dev/null -w "frontend %{http_code}\n" http://127.0.0.1:5173/
          curl -fsS -o /dev/null -w "spa route %{http_code}\n" http://127.0.0.1:5173/shop
          curl -fsS http://127.0.0.1:8000/analyses/tracks
          curl -fsS "http://127.0.0.1:8000/products?ingredients=niacinamide"
      - name: Logs
        if: always()
        run: docker compose logs --tail 80

  prod-stack:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - name: Start the production stack (Caddy uses local certificates for *.localhost)
        run: |
          cat > .env <<EOF
          SITE_DOMAIN=localhost
          API_DOMAIN=api.localhost
          ADMIN_EMAILS=admin@example.com
          SECRET_KEY=$(openssl rand -hex 32)
          POSTGRES_PASSWORD=$(openssl rand -hex 24)
          EOF
          docker compose -f docker-compose.prod.yml up -d --build
      - name: Smoke test through Caddy over HTTPS
        run: |
          R="--resolve localhost:443:127.0.0.1 --resolve api.localhost:443:127.0.0.1"
          for i in $(seq 1 80); do curl -kfsS $R https://api.localhost/health && break; sleep 3; done
          curl -kfsS $R https://api.localhost/health/ready || true
          curl -kfsS $R -o /dev/null -w "frontend %{http_code}\n" https://localhost/
          curl -kfsS $R -o /dev/null -w "spa route %{http_code}\n" https://localhost/skin-analysis
          curl -kfsS $R https://localhost/ | grep -o "connect-src 'self' https://api.localhost"
          curl -kfsS $R -X OPTIONS -H "Origin: https://localhost" -H "Access-Control-Request-Method: POST" \
            -D - -o /dev/null https://api.localhost/auth/login | grep -i "access-control-allow-origin: https://localhost"
          curl -kfsS $R -H "Content-Type: application/json" \
            -d '{"full_name":"CI Admin","email":"admin@example.com","password":"TestPassword123!"}' \
            https://api.localhost/auth/register | grep -o '"role":"admin"'
      - name: Logs
        if: always()
        run: docker compose -f docker-compose.prod.yml logs --tail 80
