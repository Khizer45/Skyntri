server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cache hashed build assets; never cache index.html.
    # nginx drops inherited add_header lines in a location that has its own,
    # so the security headers are included in both locations.
    location /assets/ {
        include /etc/nginx/skyntri-security-headers.conf;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: unknown paths load index.html (React Router handles them)
    location / {
        include /etc/nginx/skyntri-security-headers.conf;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }
}
